[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit-report"
version = "0.1.0b1"
description = "Self-hosted Fitbit and Pixel Watch health reports with Telegram and Claude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "tzdata>=2024.1",
  "python-telegram-bot>=21,<23",
  "typer>=0.12,<1",
  "matplotlib>=3.9,<4",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
fitbit-report = "fitbit_report.cli:app"

[project.urls]
Homepage = "https://github.com/davyboss/ownvitals-fitbit-reports"
Issues = "https://github.com/davyboss/ownvitals-fitbit-reports/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
